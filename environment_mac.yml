name: nyc_taxi_pipeline
channels:
  - conda-forge
dependencies:
  - python=3.10
  - openjdk=17
  - pyspark=3.5.5
  - pandas=2.3.3
  - numpy=1.26.4
  - pyarrow
  - pip
  - pip:
      - delta-spark==3.1.0  # matches the io.delta:delta-spark_2.12:3.1.0 jar; imported by data_ingestion.py
      - pytest              # tests/ (python -m pytest tests)

